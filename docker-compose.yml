
services:
  postgres:
    image: postgres:16
    container_name: mercado-futebol-db
    environment:
      POSTGRES_DB: mercado_futebol
      POSTGRES_USER: mercado
      POSTGRES_PASSWORD: mercado_dev_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercado -d mercado_futebol"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
