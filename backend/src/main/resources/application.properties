spring.application.name=mercado-futebol

# Conexao com PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/mercado_futebol
spring.datasource.username=mercado
spring.datasource.password=mercado_dev_123
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracao JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Porta da API
server.port=8080

# Migracoes do banco de dados
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
